[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./reports" },
]
gas_reports = ["DvPEscrow", "ProofOfDeliveryOracle", "ZkDeliveryAdjudicator", "TCPIOracle", "ComputePassport", "CapacityPool", "GPUWarehouseReceipt", "IsolatedLendingMarket", "ComputeCreditVault"]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[lint]
lint_on_build = false
